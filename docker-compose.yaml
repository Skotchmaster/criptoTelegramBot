services:
  crypto-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-bot:latest
    restart: unless-stopped

    env_file:
      - .env

    dns:
      - 8.8.8.8
      - 1.1.1.1

    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
